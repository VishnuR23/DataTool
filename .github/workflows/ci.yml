name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      # The statistics calibration suite is the correctness gate — it must pass
      # before anything else is considered green (CLAUDE.md immutable rule).
      - name: Stats calibration gate
        run: uv run pytest tests/stats -p no:cacheprovider

      - name: Test suite
        run: uv run pytest tests/unit tests/stats tests/integration tests/e2e -p no:cacheprovider
