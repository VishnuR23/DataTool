name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check `ARCHITECTURE.md §20 (Anti-scope)` first — some ideas
        (bandits, a recommendation engine, extra persistence backends, more than
        two variants) are intentionally out of scope for the core and belong in
        adapters or downstream projects.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that DataTool makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? If it touches an external system, would it fit as an adapter?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
