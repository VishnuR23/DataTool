<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataTool{% block title %}{% endblock %}</title>
<style>
:root { --bg:#0f1419; --panel:#1a2029; --fg:#e6e6e6; --muted:#8a94a6; --line:#2a3340; --accent:#5aa9e6; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
header h1 { font-size:16px; margin:0; }
header .muted, .muted { color: var(--muted); }
main { padding:24px; max-width:1100px; margin:0 auto; }
h2 { font-size:18px; } h3 { font-size:14px; color:var(--muted); margin:0 0 10px; text-transform:lowercase; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; text-transform:lowercase; }
.state { padding:2px 8px; border-radius:10px; font-size:12px; }
.state-proposed{color:#8a94a6;} .state-canary{color:#5ad1e6;} .state-ramping{color:#5aa9e6;}
.state-holding{color:#e6c75a;} .state-promoting{color:#7bd97b;} .state-promoted{color:#7bd97b;font-weight:700;}
.state-reverted{color:#e66a6a;font-weight:700;} .state-concluded{color:#b98ae6;}
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
.kv { display:grid; grid-template-columns:200px 1fr; gap:4px 12px; margin:0; }
.kv dt { color:var(--muted); } .kv dd { margin:0; }
.spark { color: var(--accent); }
code { color:#cdd6e0; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1><a href="/">DataTool</a></h1>
  <span class="muted">autonomous experimentation controller</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
