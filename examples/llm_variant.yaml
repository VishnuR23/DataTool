# An experiment whose treatment is generated by the LLM variant adapter
# (ARCHITECTURE.md §11.3). Registering this requires the [llm] extra and an API key;
# the surface's forbidden_components flow into the prompt as a hard constraint.
experiment: pricing-headline-llm
surface: pricing-page
owner: growth-team
description: |
  LLM-generated clearer value-prop headline for the pricing hero.

variants:
  - name: control
    is_control: true
    source: existing
    payload: {}
  - name: treatment
    source: llm
    payload:
      surface_description: |
        Pricing page hero section: headline, subheading, CTA. The current headline is
        "Plans and pricing" — we want a clearer value proposition.
      component_path: src/components/Pricing/Hero.tsx
      model: claude-opus-5-5
      seed: 17
      extra_instructions: "Keep the existing CTA button text."

contract:
  version: "1.0"

  scope:
    allowed_routes: ["/pricing"]
    forbidden_components: ["PaymentForm", "LegalDisclaimer", "TaxCalculator"]
    assignment_unit: user
    exclusivity_group: pricing
    holdout_pct: 5.0

  allocation:
    initial_canary_pct: 1.0
    ramp_schedule: [1, 2.5, 5, 10, 25]
    max_autonomous_pct: 5.0
    full_rollout_requires: human_approval
    min_step_dwell: PT4H

  guardrails:
    - name: error_rate
      source: metrics.posthog
      metric: $pageview_error_rate
      threshold: { type: relative_increase, value: 0.20 }
      window: PT10M
      min_samples_per_arm: 500
      severity: critical
      consecutive_breaches_to_trip: 2

  goal:
    source: metrics.posthog
    metric: signup_completion_rate
    direction: increase
    minimum_detectable_effect: 0.02

  statistics:
    method: confidence_sequence
    alpha: 0.05
    fdr_budget_share: 0.10
    min_runtime: PT24H
    max_runtime: P14D
    novelty_buffer: PT6H

  reversion:
    strategy: instant
    cooldown: PT24H

  graduation: {}

  authorization:
    emergency_halt: ["any"]
