<!-- cloud/console/templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>datatool — sign in</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body class="login">
  <main class="card">
    <span class="brand"><b>data</b>tool</span>
    <p class="tagline label">live telemetry console</p>

    <form method="post" action="/login">
      <label class="field">
        <span class="label">email</span>
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="label">password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn-primary" type="submit">Sign in</button>
    </form>

    <details>
      <summary class="label">create an org</summary>
      <form method="post" action="/signup">
        <label class="field">
          <span class="label">org name</span>
          <input name="org_name" required>
        </label>
        <label class="field">
          <span class="label">email</span>
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="label">password</span>
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <button class="btn-ghost" type="submit">Create org &amp; sign in</button>
      </form>
    </details>
  </main>
</body>
</html>
